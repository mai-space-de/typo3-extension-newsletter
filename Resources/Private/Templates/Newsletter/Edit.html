<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:section name="Content">
<div class="module-body">
    <h1><f:translate key="LLL:EXT:newsletter/Resources/Private/Language/locallang.xlf:backend.newsletter.edit.headline" /></h1>

    <f:form action="update" controller="Newsletter" extensionName="Newsletter" pluginName="Newsletter" object="{newsletter}" method="post">
        <div class="form-group">
            <label>Subject</label>
            <f:form.textfield property="subject" class="form-control" />
        </div>
        <div class="form-group">
            <label>Content</label>
            <f:form.textarea property="content" class="form-control" rows="15" />
        </div>
        <div class="form-group">
            <label>Status</label>
            <f:form.select property="status" class="form-control" options="{0: 'Draft', 1: 'Scheduled', 2: 'Sent'}" />
        </div>
        <div class="form-group">
            <label>Scheduled At</label>
            <f:form.textfield property="scheduledAt" class="form-control" type="datetime-local" />
        </div>
        <div class="form-group">
            <label>Target Lists</label>
            <f:form.select property="targetLists" class="form-control" options="{subscriberLists}" optionValueField="uid" optionLabelField="name" multiple="multiple" size="5" />
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <f:link.action action="preview" arguments="{newsletter: newsletter}" class="btn btn-info">Preview</f:link.action>
        <f:link.action action="list" class="btn btn-secondary">Cancel</f:link.action>
    </f:form>
</div>
</f:section>
</html>
