<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:section name="Content">
<div class="module-body">
    <h1>Newsletter Overview</h1>

    <be:link.newRecord table="tx_newsletter_domain_model_newsletter" returnUrl="{f:be.uri(route:'newsletter_list')}" class="btn btn-success">
        <f:translate key="LLL:EXT:newsletter/Resources/Private/Language/locallang.xlf:backend.newsletter.new.headline" />
    </be:link.newRecord>

    <f:if condition="{newsletters}">
        <f:then>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Status</th>
                        <th>Scheduled At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{newsletters}" as="newsletter">
                        <tr>
                            <td>{newsletter.subject}</td>
                            <td>
                                <f:if condition="{newsletter.status} == 0">Draft</f:if>
                                <f:if condition="{newsletter.status} == 1">Scheduled</f:if>
                                <f:if condition="{newsletter.status} == 2">Sent</f:if>
                            </td>
                            <td>
                                <f:if condition="{newsletter.scheduledAt}">
                                    <f:format.date date="{newsletter.scheduledAt}" format="d.m.Y H:i" />
                                </f:if>
                            </td>
                            <td>
                                <f:link.action action="edit" arguments="{newsletter: newsletter}" class="btn btn-sm btn-primary">Edit</f:link.action>
                                <f:link.action action="preview" arguments="{newsletter: newsletter}" class="btn btn-sm btn-info">Preview</f:link.action>
                                <f:link.action action="statistics" arguments="{newsletter: newsletter}" class="btn btn-sm btn-secondary">Statistics</f:link.action>
                                <f:link.action action="delete" arguments="{newsletter: newsletter}" class="btn btn-sm btn-danger" additionalAttributes="{data-confirm: 'Are you sure?'}">Delete</f:link.action>
                            </td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </f:then>
        <f:else>
            <div class="alert alert-info">No newsletters found.</div>
        </f:else>
    </f:if>
</div>
</f:section>
</html>
