<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Default"/>
<f:section name="main">
    <div class="mai-newsletter-subscribe">
        <h2><f:translate key="subscribe.title" extensionName="mai_newsletter" default="Subscribe to our newsletter"/></h2>
        <f:flashMessages/>
        <f:form.validationResults>
            <f:if condition="{validationResults.flattenedErrors}">
                <div class="mai-newsletter-subscribe__errors" role="alert">
                    <f:for each="{validationResults.flattenedErrors}" as="errors" key="propertyName">
                        <f:for each="{errors}" as="error">
                            <p class="mai-newsletter-subscribe__error">{error.message}</p>
                        </f:for>
                    </f:for>
                </div>
            </f:if>
        </f:form.validationResults>
        <f:form action="subscribe" method="post">
            <div class="form-group">
                <label for="email"><f:translate key="subscribe.email" extensionName="mai_newsletter" default="E-Mail"/></label>
                <f:form.textfield id="email" name="email" type="email" class="form-control" required="true" autocomplete="email"/>
            </div>
            <div class="form-actions">
                <f:form.submit value="{f:translate(key: 'subscribe.submit', extensionName: 'mai_newsletter', default: 'Subscribe')}" class="btn btn-primary"/>
            </div>
        </f:form>
    </div>
</f:section>
</html>
