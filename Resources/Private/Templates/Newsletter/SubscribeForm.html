<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Default"/>
<f:section name="main">
    <section class="mai-newsletter-subscribe">
        <header class="mai-newsletter-subscribe__header">
            <h2 class="mai-newsletter-subscribe__title">
                <f:translate key="subscribe.title" extensionName="mai_newsletter" default="Subscribe to our newsletter"/>
            </h2>
            <p class="mai-newsletter-subscribe__lead">
                <f:translate key="subscribe.lead" extensionName="mai_newsletter" default="Stay up to date — practical, helpful, warm-hearted. We'll keep you posted about our work, events and opportunities to get involved."/>
            </p>
        </header>

        <f:flashMessages as="flashMessages">
            <f:if condition="{flashMessages}">
                <f:for each="{flashMessages}" as="flashMessage">
                    <f:if condition="{flashMessage.severity} == 'OK'">
                        <div class="mai-newsletter-subscribe__success" role="status" data-testid="newsletter-success">
                            <span class="mai-newsletter-subscribe__success-icon" aria-hidden="true">&#10003;</span>
                            <p class="mai-newsletter-subscribe__success-text">{flashMessage.message}</p>
                        </div>
                    </f:if>
                    <f:if condition="{flashMessage.severity} != 'OK'">
                        <div class="mai-newsletter-subscribe__flash-error" role="alert">
                            <p class="mai-newsletter-subscribe__flash-error-message">{flashMessage.message}</p>
                        </div>
                    </f:if>
                </f:for>
            </f:if>
        </f:flashMessages>

        <f:form.validationResults>
            <f:if condition="{validationResults.flattenedErrors}">
                <div class="mai-newsletter-subscribe__errors" role="alert" data-testid="email-error">
                    <f:for each="{validationResults.flattenedErrors}" as="errors" key="propertyName">
                        <f:for each="{errors}" as="error">
                            <p class="mai-newsletter-subscribe__error">{error.message}</p>
                        </f:for>
                    </f:for>
                </div>
            </f:if>
        </f:form.validationResults>

        <f:form action="subscribe" method="post" class="mai-newsletter-subscribe__form" data-testid="newsletter-form">
            <div class="mai-newsletter-subscribe__field">
                <label for="mai-newsletter-email" class="mai-newsletter-subscribe__label">
                    <f:translate key="subscribe.email" extensionName="mai_newsletter" default="E-Mail"/>
                </label>
                <f:form.textfield
                    id="mai-newsletter-email"
                    property="email"
                    type="email"
                    required="true"
                    autocomplete="email"
                    class="mai-newsletter-subscribe__input"
                    placeholder="max@beispiel.de"
                />
            </div>
            <f:form.submit
                value="{f:translate(key: 'subscribe.submit', extensionName: 'mai_newsletter', default: 'Subscribe')}"
                class="mai-newsletter-subscribe__submit"
            />
            <p class="mai-newsletter-subscribe__legal">
                <f:translate key="subscribe.privacy" extensionName="mai_newsletter" default="We respect your privacy. You can unsubscribe at any time."/>
            </p>
        </f:form>
    </section>
</f:section>
</html>
