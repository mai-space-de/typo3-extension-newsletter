<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Main">
    <h1><f:translate key="LLL:EXT:newsletter/Resources/Private/Language/locallang.xlf:subscription.unsubscribe.headline" /></h1>

    <f:if condition="{success}">
        <f:then>
            <div class="alert alert-success">
                <f:translate key="LLL:EXT:newsletter/Resources/Private/Language/locallang.xlf:subscription.unsubscribe.success" />
            </div>
        </f:then>
        <f:else>
            <f:if condition="{token}">
                <div class="alert alert-danger">
                    <f:translate key="LLL:EXT:newsletter/Resources/Private/Language/locallang.xlf:subscription.unsubscribe.error" />
                </div>
            </f:if>
            <f:form action="unsubscribe" controller="Subscription" extensionName="Newsletter" pluginName="Subscription" method="get">
                <div class="form-group">
                    <label for="token"><f:translate key="LLL:EXT:newsletter/Resources/Private/Language/locallang.xlf:subscription.unsubscribe.token" /></label>
                    <input type="text" id="token" name="tx_newsletter_subscription[token]" class="form-control" value="{token -> f:format.htmlspecialchars()}" required="required" />
                </div>
                <button type="submit" class="btn btn-danger">Unsubscribe</button>
            </f:form>
        </f:else>
    </f:if>
</f:section>
</html>
