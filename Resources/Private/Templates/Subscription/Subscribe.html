<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Main">
    <h1><f:translate key="LLL:EXT:newsletter/Resources/Private/Language/locallang.xlf:subscription.subscribe.headline" /></h1>

    <f:if condition="{success}">
        <f:then>
            <div class="alert alert-success">
                <f:translate key="LLL:EXT:newsletter/Resources/Private/Language/locallang.xlf:subscription.subscribe.success" />
            </div>
        </f:then>
        <f:else>
            <f:if condition="{error}">
                <div class="alert alert-danger">
                    <f:if condition="{error} == 'invalid_email'">
                        <f:translate key="LLL:EXT:newsletter/Resources/Private/Language/locallang.xlf:subscription.subscribe.error.invalidEmail" />
                    </f:if>
                </div>
            </f:if>

            <f:form action="processSubscribe" controller="Subscription" extensionName="Newsletter" pluginName="Subscription" method="post">
                <div class="form-group">
                    <label for="email"><f:translate key="LLL:EXT:newsletter/Resources/Private/Language/locallang.xlf:subscription.subscribe.email" /></label>
                    <input type="email" id="email" name="tx_newsletter_subscription[email]" class="form-control" required="required" placeholder="your@email.com" />
                </div>
                <input type="hidden" name="tx_newsletter_subscription[listUid]" value="{settings.subscriberListUid}" />
                <button type="submit" class="btn">
                    <f:translate key="LLL:EXT:newsletter/Resources/Private/Language/locallang.xlf:subscription.subscribe.submit" />
                </button>
            </f:form>
        </f:else>
    </f:if>
</f:section>
</html>
