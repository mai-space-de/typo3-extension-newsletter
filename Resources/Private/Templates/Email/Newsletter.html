<!DOCTYPE html>
<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{newsletter.subject}</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .email-container { max-width: 600px; margin: 0 auto; background: #ffffff; }
        .email-header { background: #007cba; color: #ffffff; padding: 20px; text-align: center; }
        .email-body { padding: 30px; }
        .email-footer { background: #f4f4f4; padding: 15px; text-align: center; font-size: 12px; color: #666; }
        a { color: #007cba; }
    </style>
</head>
<body>
<div class="email-container">
    <div class="email-header">
        <h1>{newsletter.subject}</h1>
    </div>
    <div class="email-body">
        <f:format.raw>{newsletter.content}</f:format.raw>
    </div>
    <div class="email-footer">
        <p>
            You are receiving this email because you subscribed to our newsletter.<br />
            <a href="{unsubscribeUrl}">Unsubscribe</a>
        </p>
    </div>
</div>
</body>
</html>
